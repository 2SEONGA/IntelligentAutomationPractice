[project]
name = "public-si-bid-review"
version = "0.1.0"
description = "Evidence-first public SI bid review with CrewAI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai==1.15.28",
  "pydantic>=2.7",
  "pypdf>=4",
  "pdfplumber>=0.11",
  "PyYAML>=6",
  "python-dotenv>=1",
  "requests>=2.31",
  "fastapi==0.143.0",
  "uvicorn>=0.54",
  "python-multipart>=0.0.32",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite==3.1.3",  # HITL 디스크 체크포인트
  "openai>=1.40",  # M4 임베딩 (crewai 경유가 아니라 직접 사용)
  "numpy>=1.26",
]

[project.optional-dependencies]
# OCR 보완(선택): tesseract 실행 파일과 한국어(kor) 데이터도 따로 설치해야 한다.
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
bid-review = "bid_review.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
