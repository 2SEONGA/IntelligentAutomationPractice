# 회사·검토 원칙. Agent 프롬프트와 규칙 기반 실행기가 함께 쓴다.

# 분석 대상 법인 (실적 귀속 기준)
target_legal_entity: "㈜아이티센엔텍(구 쌍용정보통신㈜)"
# 보고서에 표시하는 짧은 법인명
visible_company_name: "㈜아이티센엔텍"
# 나라장터 낙찰 이력 검색어 (현재·과거 상호)
g2b_company_search_terms:
  - 아이티센엔텍
  - 쌍용정보통신

common_agent_rules: |-
  공통 검토 원칙:
  1. 분석 대상 법인은 $target_legal_entity이며, 아이티센 그룹 전체 실적을 자동 합산하지 않는다.
  2. 공고·RFP 근거 없이 공동수급 또는 참여 법인을 가정하지 않는다.
  3. 근거 없는 사실·실적·인력·인증·경쟁사·낙찰정보·점수를 만들지 않는다.
  4. RFP 정보는 문서명, PDF 페이지, 섹션, 원문 발췌를 근거로 남긴다. 외부 정보는 출처 URL과 조회일 또는 개찰일을 남긴다.
  5. 증빙 부재·자료 충돌은 추측하지 말고 `확인 필요` 또는 `충돌`으로 표시한다.
  6. 회사 증빙 부재는 원칙적으로 `확인 필요`다. RFP의 명시적 필수조건을 충족하지 못한다는 직접 증거가 있을 때만 `미충족`으로 표시한다.
  7. 법적 참가자격, 기술 적합도, 내부 사업 판단을 분리한다. 기술 적합도가 높아도 참가자격 충족을 뜻하지 않는다.
  8. AI는 권고만 제공하며 최종 Go/No-Go 결정은 사람이 수행한다.
  9. 사업명·발주기관·공고번호·제출기한이 `확인 필요`이면 추정하거나 보완하지 말고 `판단 불가` 또는 `원문 확인 필요`로만 쓴다.

sample_evidence_notice: "현재 회사 역량 파일은 샘플 데이터입니다. 실제 내부 증빙이나 참여 법인의 확정 실적으로 해석하지 말고 원본 증빙으로 교체해야 합니다."
