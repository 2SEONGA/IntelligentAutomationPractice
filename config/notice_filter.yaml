# 공고 규칙 필터 (3주차 To-Be ② 규칙 필터). 판정 우선순위: 제외 > 확인 필요 > 검토 대상.
# 판정할 값이 없으면 "제외"가 아니라 "확인 필요"로 둔다.

# 금액: 배정예산(asignBdgtAmt), 없으면 추정가격(presmptPrce). 3년 낙찰 데이터상 아이티센엔텍 낙찰 64/67건이 40억 이상.
min_amount_krw: 4000000000

# 마감(bidClseDt)까지 이 일수 이내면 담당자 확인 필요
deadline_warn_days: 3

# 저장소 정리(M29): 마감이 이 일수보다 오래 지났고 담당자가 손대지 않은(포함/제외 사유·검토 폴더 없음) 공고는 수집 때 지운다.
# 마감 지난 공고는 담당자 포함(HITL-2) 대상이 아니다. 30일은 정정·재공고 확인 여유. 마감일을 모르는 공고는 지우지 않는다.
prune_after_deadline_days: 30

# 분야: 조달 대분류(pubPrcrmntLrgClsfcNm)가 이 목록이면 통과. 분류가 비었을 때만 공고명 키워드로 대신 판정.
ict_classes: ["ICT 서비스"]
field_keywords: ["정보시스템", "차세대", "클라우드", "인공지능", "AI"]

# 수집 검색어(공고명 검색)와 기본 기간. 빈 목록 = 키워드 없이 전체 수집(M27).
# 이전 값 ["정보시스템", "차세대", "클라우드", "인공지능", "AI"]는 30일 측정에서 규칙 통과 공고 92건 중 54건을 놓쳤다(M26).
# 분야는 위 ict_classes 규칙이 판정하므로 검색어로 좁힐 필요가 없다. ICT 분야가 아닌 공고는 저장하지 않고 건수만 남긴다.
collect_keywords: []
default_days: 30

# 계약방법(cntrctCnclsMthdNm + sucsfbidMthdNm)에 이 말이 있으면 제외
exclude_contract_terms: ["수의계약"]
# 계약방법에 이 말이 있으면 참가 조건을 원문으로 확인 (40억 이상 30건 중 8건)
confirm_contract_terms: ["제한경쟁"]

# 참가 조건 플래그: 값이 맞으면 담당자 확인 필요.
# 근거(2026-10-27 실제 응답 271건): 지역 판단기준 값 5건(모두 수의계약), 물품분류제한 Y 16건, 입찰참가제한 Y 1건.
# 업종제한(indstrytyLmtYn) Y는 226건(83%)으로 SW사업자 등록 요건이 대부분이라 표시하지 않는다.
# 공동도급 의무지역(jntcontrctDutyRgnNm1~3)은 271건 모두 비어 있어 쓰지 않는다.
confirm_flags:
  - field: rgnLmtBidLocplcJdgmBssNm
    when: nonempty
    label: 지역제한
  - field: prdctClsfcLmtYn
    when: "Y"
    label: 물품분류 제한
  - field: bidPrtcptLmtYn
    when: "Y"
    label: 입찰참가 제한
