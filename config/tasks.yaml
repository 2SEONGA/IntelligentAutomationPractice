# Task 4개의 지시문. {notice_summary} 같은 중괄호 값은 CrewAI가 실행 시 채운다.
# $common_agent_rules, $target_legal_entity, $g2b_search_terms 는 config/policy.yaml 값으로 로딩 시 치환된다.

rfp_analysis:
  description: |-
    아래 `notice_summary`와 `rfp_summary`는 규칙 기반 전처리와 품질 게이트가 검증한 축약본이다. PDF 원문, 전체 요구사항, 페이지별 로그는 제공되지 않으며 요청·복원하지 않는다. 이 정보만 검토하여 RFPReviewSummary JSON을 작성한다.

    필수 조건은 최대 5개, 충돌 최대 3개, 누락 정보 최대 5개로 제한하고, 각 항목에는 주어진 출처 페이지 또는 URL을 1개 이상 넣는다. 이 Agent의 범위는 문서 품질·RFP/공고 조건뿐이다. 회사 증빙·시장조사·역량 부족을 누락 정보에 넣지 않는다. 상세 근거가 더 필요하면 사실을 만들지 말고 `원문 확인 필요`로 쓴다. 품질 게이트가 정상 외 상태면 이를 문서 상태와 누락 정보에 반영하며, `proceed_to_next_stage`는 문서 품질 기준만으로 판단한다.

    `notice_summary.internal_project_scale`를 RFPReviewSummary의 `project_scale`에 그대로 복사한다. 이 내부 금액 기준은 법적 참가자격과 구분하며 금액·기준·출처를 임의 변경하지 않는다.

    notice_summary: {notice_summary}

    rfp_summary: {rfp_summary}

    $common_agent_rules
  expected_output: "작은 Pydantic RFPReviewSummary JSON만 반환"

capability_matching:
  description: |-
    RFP Analysis Task의 작은 결과와 아래 규칙 기반 `company_summary`만 사용해 CapabilityReviewSummary JSON을 작성한다. 분석 대상은 $target_legal_entity이며 그룹 실적을 자동 합산하지 않는다. 전체 회사 증빙 파일, 전체 요구사항, 점수 산식 원문은 제공되지 않는다.

    출력을 반드시 세 범주로 분리한다. `confirmed_company_evidence`(최대 3)는 입찰용 원본 증빙까지 확인된 자료만, `public_reference_strengths`(최대 5)는 `representative_public_records`와 `public_technology_and_certifications`의 공식 공개 근거만 넣고 문장마다 `원본 증빙 확인 필요`를 명시한다. `missing_bid_evidence`(최대 5)는 실적증명서·인증서 원본·인력 경력·등록 자료처럼 실제 입찰 판단에 필요한 자료만 쓴다. 제안서 제출, 가격입찰, 제출서식·기한은 회사 역량 부족이나 누락 증빙으로 분류하지 않는다.

    기존 `top_strengths`·`top_gaps`·`critical_evidence_to_verify`도 같은 구분과 모순되지 않게 짧게 작성한다. 공개자료가 있다고 이를 `충족`으로 바꾸거나 수치 점수를 만들지 않는다. 법적 참가자격과 회사 역량을 혼동하지 말고, 증빙이 없으면 `확인 필요`로 쓴다. Go/No-Go 결론을 내리지 않는다.

    company_summary: {company_summary}

    $common_agent_rules
  expected_output: "작은 Pydantic CapabilityReviewSummary JSON만 반환"

market_research:
  description: |-
    RFP Analysis Task의 작은 결과와 아래 규칙 기반 `market_summary`만 사용해 MarketReviewSummary JSON을 작성한다. 나라장터 조회와 출처 검증은 이미 규칙 기반 실행기가 수행했다. 이 Task는 도구·웹 검색·추가 API 호출을 하지 않는다.

    `research_status`는 `market_summary.research_status` 값을 그대로 사용한다. 유사사례 수는 주어진 숫자만 사용한다. `market_observations`에는 `market_summary.market_observations` 또는 `representative_cases`에 있는 시장 사실만 쓰고, RFP·공고의 제출조건을 시장 관찰로 쓰지 않는다. 관찰·한계·추가 확인 근거는 각각 최대 3개이며 모든 항목에 주어진 URL 또는 시장 조회 상태를 넣는다. 과거 낙찰사를 이번 경쟁사·참여사로 단정하지 않는다. 시장조사가 미실행 또는 근거 부족이면 그 상태와 사유를 그대로 반영한다.

    market_summary: {market_summary}

    $common_agent_rules
  expected_output: "작은 Pydantic MarketReviewSummary JSON만 반환"

report_writing:
  description: |-
    앞선 세 Task의 작은 Pydantic 결과만 종합해 ExecutiveDecisionSummary JSON을 작성한다. 긴 Markdown 보고서는 작성하지 않는다. 최종 Markdown은 별도 규칙 기반 렌더러가 만든다.

    Agent 1의 project_scale 금액·내부 기준·출처를 유지한다. 기준 미달은 내부 규모 기준에 따른 원칙적 No-Go 검토 및 사업본부장의 전략적 예외 검토 사유이며 법적 자격 미충족으로 바꾸지 않는다. 공고문/자격 미확인은 최종 보류로 남을 수 있다. 필수 기술·인력 미충족을 무시하고 Go를 권고하지 않는다.

    긍정 요인 최대 3개, 리스크 최대 5개, 다음 조치 최대 7개다. Agent 2의 `public_reference_strengths`가 있으면 공개 근거 기반 사전 강점으로 활용하되, 원본 증빙 확인 필요를 함께 쓴다. 법적 참가자격, 회사 역량·실적, 제출 절차를 분리하며 제안서·가격입찰·제출서식은 회사 역량 부족으로 쓰지 않는다. 모든 항목에 상세 산출물 참조를 넣는다. 새 사실·점수·실적·경쟁사·인용을 만들지 않는다. 필수 참가자격 또는 핵심 증빙이 미확인이면 `보류`를 우선하며, 명확한 법적 자격·필수 기술·인력 미충족 또는 내부 규모 기준 미달은 No-Go 검토 근거로 사용하되, 각 사유를 구분한다. `final_decision_owner`는 반드시 사업 담당자다.

    $common_agent_rules
  expected_output: "작은 Pydantic ExecutiveDecisionSummary JSON만 반환"
