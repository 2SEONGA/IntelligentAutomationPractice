# 공공 SI 입찰 Go/No-Go 체크리스트 (㈜아이티센엔텍 기준)
# 근거: data/market/itcen_group_awards_3y.json — 2023-10~2026-10 나라장터 용역 낙찰 351,025건 중 그룹 낙찰 93건
#       (아이티센엔텍 67건, 디지털서비스몰 카탈로그 계약 제외). 해설은 docs/go_no_go_checklist.md.
# 판정: 1단계(knockout)에서 하나라도 '미충족'이면 No-Go, '확인 필요'가 있으면 보류.
#       모두 '충족'이면 2단계 점수(최대 10점)로 권고 등급을 정한다. 최종 결정은 사업본부장.
version: "2026-10-27"
target_legal_entity: "㈜아이티센엔텍(구 쌍용정보통신㈜)"

knockout:
  - id: K1
    title: "법적 입찰참가자격"
    question: "공고의 업종 등록(소프트웨어사업자 등)·면허를 보유하고, 입찰참가 제한·부정당업자 제재 대상이 아닌가?"
    source: "입찰공고문 참가자격 조항"
  - id: K2
    title: "대기업 참여제한 (SW진흥법 제48조)"
    question: "사업금액이 「중소 소프트웨어사업자의 사업 참여 지원에 관한 지침」 별표 1의 대기업 참여 하한 이상이거나, 공고에 대기업 참여 허용(예외 인정)이 명시되어 있는가?"
    source: "공고문 참가자격, 과기정통부 고시 별표 1 원문 (하한 금액은 원문으로 확인)"
    data_note: "아이티센엔텍 낙찰 67건 중 64건이 40억 원 이상. 40억 미만 3건은 모두 후속·연계 사업(아래 S1 예외 참고)."
    # T1.5 자동 판정 기준: 나라장터 금액이 RFP와 일치(confirmed)할 때 이 금액(VAT 기준 환산) 미만이면 미충족.
    min_amount_krw: 4000000000
    amount_vat_basis: included
  - id: K3
    title: "공동수급·지역·참여 법인 조건"
    question: "공동수급 허용 여부, 지역 제한, 하도급 제한이 참여 법인 구성과 충돌하지 않는가?"
    source: "공고문 공동계약·지역제한 조항"
  - id: K4
    title: "필수 인증·인력"
    question: "RFP가 필수로 요구하는 인증(CMMI·ISO 등)과 PM·핵심인력 자격을 원본 증빙으로 충족하는가?"
    source: "RFP 참가자격·투입인력 조항, 회사 원본 증빙"

# 2단계: 각 항목 0~2점. 과거 낙찰 67건에 적용 시 6점 이상 51건(76%), 4~5점 12건, 3점 이하 4건.
scoring:
  - id: S1
    title: "사업 규모"
    levels:
      2: "100억 원 이상 (과거 낙찰 36/67건)"
      1: "40억~100억 원 (28/67건)"
      0: "40억 원 미만 — 후속 대형사업 선행(ISP·컨설팅) 또는 수행 중 시스템 연계일 때만 예외 검토 (3/67건)"
  - id: S2
    title: "주력 사업 유형"
    levels:
      2: "운영·유지관리(ITO), 정보자원·인프라 통합구축, 클라우드 전환, 차세대·재구축"
      1: "그 밖의 SW 구축·고도화, ISP·컨설팅"
      0: "주력과 무관한 소규모 솔루션 개발·콘텐츠·물품성 사업"
    data_note: "운영·유지관리 31건, SW 구축·고도화 16건, 인프라·HW 11건, 클라우드 6건, ISP·컨설팅 3건"
    # 자동 판정: 사업명·범위에 2점 키워드가 있으면 2, 1점 키워드만 있으면 1, 없으면 미정
    keywords:
      2: [유지관리, 유지보수, 운영, 정보자원, 인프라, 클라우드, 재해복구, DR, 차세대, 재구축, 통합구축]
      1: [구축, 고도화, 개발, ISP, 컨설팅]
  - id: S3
    title: "핵심 발주기관"
    levels:
      2: "핵심 7개 기관: 한국교육학술정보원, 한국지역정보개발원, 국민건강보험공단, 국가정보자원관리원, 한국지능정보사회진흥원, 국세청, 인사혁신처"
      1: "3년 내 수주 이력이 있는 그 밖의 기관"
      0: "수주 이력이 없는 신규 기관"
    data_note: "핵심 7개 기관이 67건 중 49건(73%)"
    # 자동 판정: 발주기관명에 아래 이름이 포함되면 2점 (예: "행정안전부 국가정보자원관리원 광주센터")
    core_agencies: [한국교육학술정보원, 한국지역정보개발원, 국민건강보험공단, 국가정보자원관리원, 한국지능정보사회진흥원, 국세청, 인사혁신처]
  - id: S4
    title: "수행 중 사업의 후속(인컴번트)"
    levels:
      2: "현재 수행 중이거나 직전 차수를 수행한 사업의 후속·연차 사업"
      0: "해당 없음"
    data_note: "2025년 이후 낙찰 38건 중 22건(58%)이 같은 기관 동일 사업의 후속 수주"
  - id: S5
    title: "예상 경쟁 강도"
    levels:
      2: "단독 응찰 예상 (과거 40/67건, 낙찰률 약 99.9~100%)"
      1: "2개사 경쟁 예상 (20/67건)"
      0: "3개사 이상 경쟁 예상 (7/67건)"
    how_to_check: "같은 사업 직전 차수의 개찰결과 참여업체 수(나라장터 개찰결과)"

decision:
  go: 6          # 6점 이상: Go 권고
  review: 4      # 4~5점: 사업본부장 전략 검토 (조건부)
                 # 3점 이하: No-Go 권고

# 점수와 별개로 보고서에 반드시 적는 확인 사항 (데이터 근거 아님, 일반 프리세일즈 기준)
review_notes:
  - "기술·가격 평가 비중과 가격 평가 방식(협상에 의한 계약 여부)"
  - "다년 계약이면 연차별 집행액과 총액 (예: 5년 분할 집행)"
  - "동시 수행 중인 대형사업 대비 PM·핵심인력 투입 가능 여부"
  - "지체상금·하자보수·SLA 등 계약 리스크 조항"

# 판단 기준 화면 "근거 데이터의 한계" 카드. 근거 파일 meta.limitations를 풀어 쓴 것.
data_limits:
  - title: "낙찰 기록만 있음"
    missing: "1순위 대표사로 낙찰된 공고만 포함. 참여했다가 진 입찰, 공동수급 구성원으로 참여한 사업은 빠짐"
    impact: "이긴 사업 위주라 기준이 '수주 가능성이 높은 공고' 쪽으로 치우칠 수 있음"
    response: "점수는 권고일 뿐, 최종 판단은 사업본부장 결정으로 남김"
  - title: "Go 결정의 근사치"
    missing: "내부 Go/No-Go 결정 기록이 아니라 '참여해서 이긴 공고'를 Go로 간주"
    impact: "참여했지만 진 Go, 검토 후 포기한 No-Go는 기준에 반영되지 않음"
    response: "의사결정 이력에 실제 결정이 쌓이면, 판단 기준 세트로 기준을 보정"
  - title: "협상계약 낙찰률 없음"
    missing: "협상에 의한 계약은 나라장터 응답에 낙찰률이 비어 있음"
    impact: "S5 경쟁 강도를 낙찰률만으로 가늠할 수 없음"
    response: "직전 차수 개찰결과의 참여업체 수로 확인 (S5 확인 방법)"
